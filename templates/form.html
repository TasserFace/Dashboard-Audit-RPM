<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah RPM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } .bg-nusantara { background-color: #0857C3 !important; }</style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-nusantara mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-white" href="/">Dashboard RPM</a>
            <div class="d-flex text-white align-items-center ms-auto">
                <span class="me-3 fw-bold">Halo, {{ session['nama_lengkap'] }}</span>
                <a href="/logout" class="btn btn-sm btn-light text-danger fw-bold">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 800px;">
        <div class="card shadow-sm border-0 border-top border-4 border-primary">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold" style="color: #0857C3;">Form Tambah Rencana Perbaikan Manajemen</h5>
            </div>
            <div class="card-body p-4">
                <form action="/input" method="POST">
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">No. Laporan Hasil Audit</label>
                            <input type="text" class="form-control" name="no_lha" required placeholder="Contoh: LHA-01/2026">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Jenis Audit</label>
                            <select class="form-select" name="jenis_audit" required>
                                <option value="" disabled selected>-- Pilih Jenis --</option>
                                <option value="Reguler Audit">Reguler Audit</option>
                                <option value="Spesial Audit">Spesial Audit</option>
                                <option value="Surprise Audit">Surprise Audit</option>
                                <option value="Investigatif Audit">Investigatif Audit</option>
                                <option value="Tematik Audit">Tematik Audit</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Unit Kerja</label>
                            <input type="text" class="form-control" name="unit_kerja" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Deskripsi Tindak Lanjut</label>
                        <textarea class="form-control" name="deskripsi" rows="3" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Tenggat Waktu Awal</label>
                        <input type="date" class="form-control w-50" name="tenggat_waktu" required>
                    </div>

                    <hr class="mb-4">
                    <h6 class="fw-bold text-primary mb-3">Informasi Kontak & Entitas</h6>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Nama PIC (Auditee)</label>
                            <input type="text" class="form-control" name="nama_pic" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label">No. WA PIC (Auditee)</label>
                            <input type="text" class="form-control" name="wa_auditee" required placeholder="0812xxx">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Nama Auditor (PIC RPM)</label>
                            <input type="text" class="form-control" name="nama_auditor" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label">No. WA Auditor</label>
                            <input type="text" class="form-control" name="wa_auditor" required placeholder="0813xxx">
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Nama Ketua Tim Audit</label>
                            <input type="text" class="form-control" name="nama_ketua_tim" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label">No. WA Ketua Tim Audit</label>
                            <input type="text" class="form-control" name="wa_ketua_tim" required placeholder="0856xxx">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/" class="btn btn-secondary fw-bold">Batal</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold" style="background-color: #0857C3;">Simpan RPM</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
