<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Input RPM Baru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Form Input Rencana Perbaikan Manajemen</h5>
            </div>
            <div class="card-body">
                <form action="/input" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jenis Audit</label>
                        <select class="form-select" name="jenis_audit" required>
                            <option value="" disabled selected>-- Pilih Jenis Audit --</option>
                            <option value="Reguler Audit">Reguler Audit</option>
                            <option value="Spesial Audit">Spesial Audit</option>
                            <option value="Surprise Audit">Surprise Audit</option>
                            <option value="Investigatif Audit">Investigatif Audit</option>
                            <option value="Tematik Audit">Tematik Audit</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Unit Kerja</label>
                        <input type="text" class="form-control" name="unit_kerja" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Deskripsi Tindak Lanjut</label>
                        <textarea class="form-control" name="deskripsi" rows="3" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Tenggat Waktu Awal</label>
                        <input type="date" class="form-control" name="tenggat_waktu" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">WA Auditee (PIC)</label>
                            <input type="text" class="form-control" name="wa_auditee" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">WA Auditor</label>
                            <input type="text" class="form-control" name="wa_auditor" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">WA Ketua Tim</label>
                            <input type="text" class="form-control" name="wa_ketua_tim" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Kembali</a>
                        <button type="submit" class="btn btn-primary">Simpan Data</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
