<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tindak Lanjut RPM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; color: #0857C3; } .bg-nusantara { background-color: #0857C3 !important; }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-nusantara mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-white" href="/">Dashboard RPM</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-white" href="/">Ringkasan</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/monitoring">Monitoring RPM</a></li>
                </ul>
                <div class="d-flex text-white align-items-center ms-auto">
                    <span class="me-3 fw-bold">Halo, {{ session['nama_lengkap'] }}</span>
                    <a href="/logout" class="btn btn-sm btn-light text-danger fw-bold">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container" style="max-width: 700px;">
        <h4 class="fw-bold mb-3 text-nusantara">Formulir Usulan Tindak Lanjut RPM</h4>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form action="/edit/{{ item.id }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3"><label class="fw-bold">Status Saat Ini:</label> <span class="badge bg-secondary">{{ item.status }}</span></div>
                    <div class="mb-3">
                        <label class="fw-bold">Usulan Status Baru</label>
                        <select class="form-select border-primary" name="status" required>
                            <option value="Dalam Pemantauan" {% if item.status == 'Dalam Pemantauan' %}selected{% endif %}>Dalam Pemantauan</option>
                            <option value="Belum Memadai" {% if item.status == 'Belum Memadai' %}selected{% endif %}>Belum Memadai</option>
                            <option value="Memadai" {% if item.status == 'Memadai' %}selected{% endif %}>Memadai</option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="fw-bold">Unggah Bukti Status (PDF/JPG)</label><input type="file" class="form-control" name="file_bukti"></div>
                    <hr>
                    <div class="mb-3"><label class="fw-bold">Usulkan Tenggat Waktu Baru</label><input type="date" class="form-control" name="tenggat_waktu" value="{{ item.tenggat_waktu }}" required></div>
                    <div class="mb-3"><label class="fw-bold">Nomor Berita Acara (BA) Kesepakatan</label><input type="text" class="form-control" name="no_ba" placeholder="Wajib diisi jika mengubah tenggat"></div>
                    <div class="mb-3"><label class="fw-bold">Tanggal Berita Acara (BA)</label><input type="date" class="form-control" name="tgl_ba"></div>
                    <div class="mb-3"><label class="fw-bold">Unggah Dokumen BA (PDF/JPG)</label><input type="file" class="form-control" name="file_ba"></div>
                    <hr>
                    <div class="mb-3">
                        <label class="fw-bold text-danger">Otorisasi Password Akun Anda</label>
                        <input type="password" class="form-control border-danger" name="password_otorisasi" required placeholder="Masukkan password Anda untuk konfirmasi">
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold bg-nusantara">Kirim Usulan ke Ketua Tim</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
