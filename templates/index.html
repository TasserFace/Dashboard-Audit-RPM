<!DOCTYPE html>
<html lang="id">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Dashboard RPM Audit</title>
</head>
<body class="container mt-5">
    <h2>Dashboard Monitoring Rencana Perbaikan Manajemen</h2>
    <a href="/input" class="btn btn-primary mb-3">+ Tambah RPM</a>
    
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Unit Kerja</th><th>Tenggat Waktu</th><th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for item in data %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.unit_kerja }}</td>
                <td>{{ item.tenggat_waktu }}</td>
                <td>
                    <!-- Pewarnaan badge berdasarkan status -->
                    <span class="badge 
                        {% if item.status == 'Memadai' %} bg-success 
                        {% elif item.status == 'Overdue' %} bg-danger 
                        {% else %} bg-warning text-dark {% endif %}">
                        {{ item.status }}
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
