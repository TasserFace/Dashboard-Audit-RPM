<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - SIMA RPM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f1f3f5; } 
        .bg-nusantara { background-color: #0857C3 !important; } 
        .btn-nusantara { background-color: #0857C3; color: white; border: none; } 
        .btn-nusantara:hover { background-color: #307FE2; color: white; } 
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-lg border-0" style="width: 400px; border-radius: 12px; overflow: hidden;">
        <div class="bg-nusantara text-white text-center py-4">
            <h4 class="mb-0 fw-bold">Sistem Monitoring RPM</h4>
        </div>
        <div class="card-body p-4 bg-white">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Username (PN)</label>
                    <input type="text" class="form-control bg-light" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Password</label>
                    <input type="password" class="form-control bg-light" name="password" required>
                </div>
                
                <div class="text-end mb-4">
                    <a href="/forgot-password" class="text-decoration-none fw-bold" style="color: #0857C3; font-size: 0.9em;">Lupa Password?</a>
                </div>

                <button type="submit" class="btn btn-nusantara w-100 fw-bold py-2">MASUK</button>
            </form>
        </div>
    </div>
</body>
</html>
